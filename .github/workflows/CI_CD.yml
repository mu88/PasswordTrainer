name: Combined CI / Release

on:
  workflow_dispatch:
  push:
    branches:
      - '**'

jobs:
  shared_ci_cd:
    permissions:
      attestations: write
      contents: write # Needed for dependency submission (SBOM upload)
      id-token: write
      packages: write

    uses: mu88/common/.github/workflows/ci-cd.yml@659c67cebafdb909d1fcdba213eb4c5879a7bb6e # main
    with:
      docker-attest-provenance-and-sbom: true
      docker-publish-project: src/PasswordTrainer/PasswordTrainer.csproj
      sonar-additional-params: '/d:sonar.coverage.exclusions=**/wwwroot/**,**/Program.cs' # exclude static JS files and composition root
      sonar-key: mu88_PasswordTrainer
    secrets:
      sonar-token: ${{ secrets.SONAR_TOKEN }}
